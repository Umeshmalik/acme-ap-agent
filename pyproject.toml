[project]
name = "fourx-take-home"
version = "0.1.0"
description = "FourX take-home: a small agent harness"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "groq>=0.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning"]
